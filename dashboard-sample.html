<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Market Monitor — sample redesign</title>
<!--
  SAMPLE REDESIGN of dashboard.html (Overview tab only). It does not replace the
  live dashboard; nothing links to it. It reads the same /api/status endpoint:
  served from the API it uses relative URLs, opened as a file it calls
  http://localhost:8765 (override with ?api=http://host:port), and if neither
  answers it renders a saved snapshot so the design can still be reviewed.

  Motion rules this page follows (emil-design-eng):
  - Keyboard actions (↑/↓, j/k, Esc, /) never animate.
  - Things seen tens of times a minute (row hover, selection, detail swap) don't
    animate either; only press feedback does, at 120ms.
  - Occasional UI (filter indicator, tooltip, toast, mobile sheet) animates with
    strong ease-out curves, under 300ms except the sheet, which uses the iOS
    drawer curve.
  - Only transform, opacity and clip-path are animated.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var saved = localStorage.getItem("ohm-sample-theme");
    var dark = saved ? saved === "dark"
                     : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
  --header-h: 56px;
}

/* Neutral surfaces; colour is reserved for state. Hairlines are translucent
   shadows rather than solid borders so they sit correctly on any surface. */
:root[data-theme="light"] {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #f2f2f4;
  --surface-hover: #f6f6f8;
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #8b8b94;
  --hairline: rgba(24, 24, 27, 0.08);
  --hairline-strong: rgba(24, 24, 27, 0.14);
  --shadow-card: 0 0 0 1px rgba(24,24,27,.06), 0 1px 2px rgba(24,24,27,.04);
  --shadow-pop: 0 0 0 1px rgba(24,24,27,.08), 0 8px 24px -6px rgba(24,24,27,.18);
  --accent: #6d28d9;
  --accent-soft: rgba(109, 40, 217, 0.08);
  --accent-line: rgba(109, 40, 217, 0.35);
  --red: #dc2626;    --red-soft: rgba(220, 38, 38, 0.09);   --red-text: #b91c1c;
  --amber: #d97706;  --amber-soft: rgba(217, 119, 6, 0.11); --amber-text: #92400e;
  --green: #16a34a;  --green-soft: rgba(22, 163, 74, 0.10); --green-text: #166534;
  --gray-soft: rgba(24, 24, 27, 0.06);
  --header-bg: rgba(247, 247, 248, 0.78);
  --scrim: rgba(24, 24, 27, 0.32);
}
:root[data-theme="dark"] {
  --bg: #0c0c0e;
  --surface: #151518;
  --surface-2: #1c1c20;
  --surface-hover: #1a1a1e;
  --text: #ededef;
  --text-2: #a1a1aa;
  --text-3: #71717a;
  --hairline: rgba(255, 255, 255, 0.07);
  --hairline-strong: rgba(255, 255, 255, 0.13);
  --shadow-card: 0 0 0 1px rgba(255,255,255,.06);
  --shadow-pop: 0 0 0 1px rgba(255,255,255,.09), 0 12px 32px -8px rgba(0,0,0,.7);
  --accent: #a78bfa;
  --accent-soft: rgba(167, 139, 250, 0.10);
  --accent-line: rgba(167, 139, 250, 0.45);
  --red: #f87171;    --red-soft: rgba(248, 113, 113, 0.12);  --red-text: #fca5a5;
  --amber: #fbbf24;  --amber-soft: rgba(251, 191, 36, 0.12); --amber-text: #fcd34d;
  --green: #4ade80;  --green-soft: rgba(74, 222, 128, 0.10); --green-text: #86efac;
  --gray-soft: rgba(255, 255, 255, 0.07);
  --header-bg: rgba(12, 12, 14, 0.72);
  --scrim: rgba(0, 0, 0, 0.55);
}

/* Theme switches must not run every element's colour transition at once. */
.no-transitions *, .no-transitions *::before, .no-transitions *::after { transition: none !important; }

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  font-size: 0.8125rem;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
svg { display: block; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Press feedback: the one animation every control gets. */
.pressable { transition: transform 120ms var(--ease-out); }
.pressable:active { transform: scale(0.97); }

/* ─── Header ─────────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 20;
  height: var(--header-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px;
  background: var(--header-bg);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  backdrop-filter: blur(16px) saturate(180%);
  box-shadow: 0 1px 0 transparent;
  transition: box-shadow 200ms ease;
}
.header.scrolled { box-shadow: 0 1px 0 var(--hairline); }
@media (prefers-reduced-transparency: reduce) {
  .header { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--text); color: var(--bg);
  display: grid; place-items: center;
}
.brand-name { font-weight: 600; font-size: 0.875rem; letter-spacing: -0.01em; white-space: nowrap; }
.brand-sep { color: var(--text-3); }
.brand-page { color: var(--text-2); white-space: nowrap; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 28px; padding: 0 10px; border-radius: 999px;
  font-size: 0.75rem; font-weight: 500; color: var(--text-2);
  background: var(--gray-soft);
  white-space: nowrap;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.status-pill.stale .status-dot { background: var(--amber); }
.status-pill.offline .status-dot { background: var(--red); }
.status-pill.sample .status-dot { background: var(--text-3); }

.clock { font-size: 0.75rem; color: var(--text-3); white-space: nowrap; }

.icon-btn {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: grid; place-items: center; color: var(--text-2);
}
.btn {
  height: 32px; padding: 0 12px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 0.8125rem; font-weight: 500; color: var(--text);
  background: var(--surface); box-shadow: var(--shadow-card);
  white-space: nowrap;
}
@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover { background: var(--gray-soft); color: var(--text); }
  .btn:hover { background: var(--surface-hover); }
}
.btn[aria-busy="true"] { color: var(--text-2); cursor: progress; }
/* A faster spinner reads as faster loading. Linear: it's constant motion. */
.btn[aria-busy="true"] .refresh-icon { animation: spin 600ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Layout ─────────────────────────────────────────────── */
.page { max-width: 1440px; margin: 0 auto; padding: 20px 24px 48px; }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 14px; margin-bottom: 16px;
  border-radius: var(--radius-sm);
  background: var(--amber-soft); color: var(--amber-text);
  font-size: 0.8125rem;
}
.notice[hidden] { display: none; }
.notice.error { background: var(--red-soft); color: var(--red-text); }
.notice.neutral { background: var(--gray-soft); color: var(--text-2); }
.notice b { font-weight: 600; }
.notice svg { margin-top: 2px; }

/* ─── Filter / summary segmented control ──────────────────
   The summary numbers ARE the filter. The active state is drawn by a duplicate
   layer clipped to the active segment; moving the clip-path animates the
   colour change perfectly, which per-button colour transitions can't do. */
.segments-wrap { margin-bottom: 16px; }
.segments {
  position: relative;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 4px;
}
.segments-layer { display: contents; }
.seg {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 10px 14px 11px; border-radius: 9px; text-align: left;
  min-width: 0;
}
.seg-label { font-size: 0.75rem; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.seg-value { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; }
.seg-sub { font-size: 0.6875rem; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
@media (hover: hover) and (pointer: fine) {
  .segments-base .seg:hover { background: var(--surface-hover); }
}
.segments-active {
  position: absolute; inset: 4px;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  pointer-events: none;
  background: var(--accent-soft);
  border-radius: 9px;
  box-shadow: inset 0 0 0 1px var(--accent-line);
  clip-path: inset(0 75% 0 0 round 9px);
  transition: clip-path 220ms var(--ease-out);
}
.segments-active .seg-label, .segments-active .seg-value { color: var(--accent); }
.segments-active .seg-sub { color: var(--accent); opacity: .75; }
.segments-active.instant { transition: none; }

/* ─── Main grid ──────────────────────────────────────────── */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-card); min-width: 0; }
.table-wrap { overflow-x: clip; }  /* clip, not auto: a scroll container would break the sticky header */

.list-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px 12px 16px;
}
.list-title { font-weight: 600; font-size: 0.875rem; letter-spacing: -0.01em; }
.list-count { color: var(--text-3); }
.search {
  margin-left: auto; position: relative; display: flex; align-items: center;
}
.search svg { position: absolute; left: 9px; color: var(--text-3); pointer-events: none; }
.search input {
  height: 30px; width: 200px; padding: 0 30px 0 30px;
  border: 0; border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text);
  font: inherit; font-size: 0.8125rem;
}
.search input::placeholder { color: var(--text-3); }
.search input:focus { outline: none; box-shadow: 0 0 0 2px var(--accent-line); }
.kbd {
  position: absolute; right: 7px;
  font-size: 0.6875rem; color: var(--text-3);
  padding: 0 5px; border-radius: 4px; box-shadow: 0 0 0 1px var(--hairline-strong);
  pointer-events: none;
}

.table { width: 100%; border-collapse: collapse; }
.table th {
  position: sticky; top: var(--header-h); z-index: 2;
  background: var(--surface);
  text-align: left; font-weight: 500; font-size: 0.6875rem; color: var(--text-3);
  padding: 8px 12px; box-shadow: inset 0 -1px 0 var(--hairline);
  white-space: nowrap;
}
.table th.r, .table td.r { text-align: right; }
.table td {
  padding: 0 12px; height: 48px;
  box-shadow: inset 0 -1px 0 var(--hairline);
  white-space: nowrap; vertical-align: middle;
}
.table tr:last-child td { box-shadow: none; }
.row { cursor: pointer; }
@media (hover: hover) and (pointer: fine) {
  .row:hover td { background: var(--surface-hover); }
}
.row[aria-selected="true"] td { background: var(--accent-soft); }
.row td:first-child { position: relative; padding-left: 16px; }
.row[aria-selected="true"] td:first-child::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
  border-radius: 0 2px 2px 0; background: var(--accent);
}

/* First paint only: rows cascade in. Never on refresh or filter changes. */
.row.enter { animation: rowIn 280ms var(--ease-out) both; }
@keyframes rowIn { from { opacity: 0; transform: translateY(4px); } }

.mkt { display: flex; align-items: center; gap: 10px; }
.tier-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--green); }
.tier-dot.t1 { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.tier-dot.t2 { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.tier-dot.t3 { background: var(--text-3); }
.mkt-name { font-weight: 600; letter-spacing: -0.005em; }
.mkt-quote { color: var(--text-3); font-weight: 500; }
.mkt-tag { font-size: 0.6875rem; color: var(--text-3); margin-left: 2px; }

/* Spread vs target: the bar shows the spread as a fraction of a 2× target
   scale, with the target marked — "how far over" reads without a number. */
.spread { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.spread-bar { position: relative; width: 64px; height: 4px; border-radius: 2px; background: var(--gray-soft); overflow: hidden; }
.spread-bar.none { visibility: hidden; }  /* keeps the numbers in one column */
.spread-fill { position: absolute; inset: 0; background: var(--text-3); transform-origin: left; border-radius: 2px; }
.spread-fill.over { background: var(--amber); }
.spread-fill.way-over { background: var(--red); }
.spread-target { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--text-2); }
.delta { font-size: 0.75rem; min-width: 52px; text-align: right; color: var(--text-3); }
.delta.up { color: var(--amber-text); }
.delta.way-up { color: var(--red-text); }

.chips { display: flex; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
  border-radius: 6px; font-size: 0.6875rem; font-weight: 600;
  background: var(--gray-soft); color: var(--text-2);
}
.chip.t1 { background: var(--red-soft); color: var(--red-text); }
.chip.t2 { background: var(--amber-soft); color: var(--amber-text); }
.chip.ok { background: none; color: var(--text-3); font-weight: 500; padding: 0; }

.tg { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--text-3); }
.tg.sent { color: var(--text); }
.tg.sent svg { color: var(--accent); }

.empty { padding: 48px 16px; text-align: center; color: var(--text-3); }
.empty b { display: block; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }

/* ─── Detail panel ───────────────────────────────────────── */
.detail { position: sticky; top: calc(var(--header-h) + 16px); max-height: calc(100vh - var(--header-h) - 32px); overflow: auto; }
.detail-inner { padding: 18px; }
.sheet-handle { display: none; }
.d-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.d-title { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
.d-sub { color: var(--text-3); font-size: 0.75rem; margin-bottom: 16px; }
.d-link {
  margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 9px; border-radius: 7px;
  font-size: 0.75rem; font-weight: 500; color: var(--text-2); text-decoration: none;
  box-shadow: 0 0 0 1px var(--hairline-strong);
}
@media (hover: hover) and (pointer: fine) { .d-link:hover { color: var(--text); background: var(--surface-hover); } }

.metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--hairline); border-radius: 10px; overflow: hidden; margin-bottom: 18px; box-shadow: 0 0 0 1px var(--hairline); }
.metric { background: var(--surface); padding: 10px 12px; min-width: 0; }
.metric-k { font-size: 0.6875rem; color: var(--text-3); margin-bottom: 2px; white-space: nowrap; }
.metric-v { font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric-v.warn { color: var(--amber-text); }
.metric-v.crit { color: var(--red-text); }

.section-k { font-size: 0.6875rem; font-weight: 600; color: var(--text-3); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.issues { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.issue { padding: 10px 12px; border-radius: 10px; box-shadow: 0 0 0 1px var(--hairline); }
.issue-top { display: flex; align-items: center; gap: 8px; }
.issue-name { font-weight: 600; }
.issue-id { color: var(--text-3); font-size: 0.75rem; }
.issue .chip { margin-left: auto; }
.issue-evidence { color: var(--text-2); margin-top: 4px; font-size: 0.75rem; }
.issue-tg { color: var(--text-3); margin-top: 4px; font-size: 0.75rem; display: flex; align-items: center; gap: 5px; }
.all-clear { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 10px; background: var(--green-soft); color: var(--green-text); margin-bottom: 18px; font-weight: 500; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 0.75rem; }
.kv dt { color: var(--text-3); }
.kv dd { text-align: right; }

.d-empty { padding: 56px 24px; text-align: center; color: var(--text-3); }
.hint { color: var(--text-3); font-size: 0.6875rem; margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.hint .kbd { position: static; display: inline-block; margin-right: 3px; }

/* ─── Tooltip ────────────────────────────────────────────
   Delayed the first time, instant on neighbours while one is already showing.
   Scales from the chip it describes (origin set from JS). */
.tip {
  position: fixed; z-index: 60; pointer-events: none;
  max-width: 260px; padding: 8px 10px; border-radius: 8px;
  background: var(--text); color: var(--bg);
  font-size: 0.75rem; line-height: 1.4;
  opacity: 0; transform: scale(0.97);
  transition: opacity 125ms var(--ease-out), transform 125ms var(--ease-out);
}
.tip.show { opacity: 1; transform: none; }
.tip.instant { transition-duration: 0ms; }
.tip b { font-weight: 600; }
.tip span { opacity: .7; }

/* ─── Toasts ─────────────────────────────────────────────
   Transitions, not keyframes, so a toast added mid-exit retargets smoothly.
   Enter and exit along the same edge; exit is quicker than enter. */
.toaster { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 10px;
  min-width: 260px; max-width: 360px; padding: 12px 14px;
  border-radius: 10px; background: var(--surface); box-shadow: var(--shadow-pop);
  font-size: 0.8125rem;
  opacity: 0; transform: translateY(100%);
  transition: opacity 400ms ease, transform 400ms ease;
}
.toast[data-mounted="true"] { opacity: 1; transform: none; }
.toast[data-leaving="true"] { opacity: 0; transform: translateY(100%); transition-duration: 200ms; transition-timing-function: ease-in-out; }
.toast-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.toast.error .toast-dot { background: var(--red); }
.toast small { color: var(--text-3); display: block; }

/* Depth is repeated in the detail panel, so it's the first column to go. */
@media (max-width: 1360px) { .col-depth { display: none; } }

/* ─── Narrow screens: detail becomes a bottom sheet ───────── */
.scrim { display: none; }
@media (max-width: 960px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .col-depth, .col-tg { display: none; }
  .detail {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 50;
    max-height: 86vh; border-radius: 16px 16px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: var(--shadow-pop);
    transform: translateY(100%);
    transition: transform 500ms var(--ease-drawer);
    overscroll-behavior: contain;
  }
  .detail.open { transform: none; }
  .detail.dragging { transition: none; }
  .sheet-handle { display: block; padding: 10px 0 2px; cursor: grab; touch-action: none; }
  .sheet-handle::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--hairline-strong); margin: 0 auto; }
  .scrim {
    display: block; position: fixed; inset: 0; z-index: 40; background: var(--scrim);
    opacity: 0; pointer-events: none; transition: opacity 300ms ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .hint { display: none; }
}
@media (max-width: 640px) {
  .header { padding: 0 16px; gap: 10px; }
  .brand-sep, .brand-page, .clock { display: none; }
  .page { padding: 16px 16px 40px; }
  .segments, .segments-active { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .segments-active { clip-path: none !important; display: none; }
  .segments-base .seg[aria-pressed="true"] { background: var(--accent-soft); }
  .segments-base .seg[aria-pressed="true"] .seg-value, .segments-base .seg[aria-pressed="true"] .seg-label { color: var(--accent); }
  .seg-value { font-size: 1.25rem; }
  .list-head { flex-wrap: wrap; }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; }
  .col-mid { display: none; }
  .spread-bar { display: none; }
  .delta, .mkt-tag, .th-sub, .search .kbd { display: none; }
  .search input { padding-right: 10px; }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function symParts(symbol) {
  const s = (symbol || "").toUpperCase();
  for (const q of ["USDT", "NGN", "GHS"]) if (s.endsWith(q)) return { base: s.slice(0, -q.length), quote: q };

// ── Toasts ───────────────────────────────────────────────────────────────────
// Timers pause while the tab is hidden, so a toast is never missed.
function toast(title, sub = "", { error = false, duration = 4000 } = {}) {
  const t = document.createElement("div");
  t.className = "toast" + (error ? " error" : "");
  t.setAttribute("role", error ? "alert" : "status");
  t.innerHTML = `<span class="toast-dot"></span><div>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
  $("toaster").appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.dataset.mounted = "true"));
  let remaining = duration, started = Date.now(), timer = null;
  const dismiss = () => {
    t.dataset.leaving = "true";
    document.removeEventListener("visibilitychange", onVis);
    setTimeout(() => t.remove(), 220);
  };
  const run = () => { started = Date.now(); timer = setTimeout(dismiss, remaining); };
  const onVis = () => {
    if (document.hidden) { clearTimeout(timer); remaining -= Date.now() - started; }
    else run();
  };
  document.addEventListener("visibilitychange", onVis);
  run();
  // Keep at most three on screen.
  const all = $("toaster").querySelectorAll(".toast:not([data-leaving])");
  if (all.length > 3) all[0].dataset.leaving = "true", setTimeout(() => all[0].remove(), 220);
}

// ── Mobile sheet with drag-to-dismiss ────────────────────────────────────────

function openSheet() {

}
function closeSheet() {
  sheetOpen = false;
  const d = $("detail");
  d.classList.remove("open", "dragging");
  d.style.transform = "";

  const row = document.querySelector(`.row[data-sym="${CSS.escape(selected || "")}"]`);

(function () {
  const d = $("detail"), handle = $("sheet-handle");
  let startY = 0, startT = 0, dy = 0, dragging = false, pid = null;
  handle.addEventListener("pointerdown", e => {
    if (!isNarrow() || dragging) return;      // ignore a second finger mid-drag
    dragging = true; pid = e.pointerId;
    startY = e.clientY; startT = performance.now(); dy = 0;
    try { handle.setPointerCapture(e.pointerId); } catch (_) { /* pointer already gone */ }
    d.classList.add("dragging");
  });
  handle.addEventListener("pointermove", e => {
    if (!dragging || e.pointerId !== pid) return;
    const raw = e.clientY - startY;
    // Down follows the finger 1:1; up meets increasing resistance.
    dy = raw >= 0 ? raw : -Math.sqrt(-raw) * 2;
    d.style.transform = `translateY(${dy}px)`;
  });

    if (!dragging || e.pointerId !== pid) return;
    dragging = false;
    d.classList.remove("dragging");
    const velocity = dy / Math.max(1, performance.now() - startT);   // px per ms
    if (dy > d.offsetHeight * 0.3 || velocity > 0.11) closeSheet();

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    source = "live";
  } catch (e) {
    err = e.message;
    if (!data && SNAPSHOT) { data = SNAPSHOT; source = "sample"; err = null; }
  } finally {
    btn.removeAttribute("aria-busy");
  }
  if (data) {
    if (!selected || !data.pairs.some(p => p.symbol === selected)) {
      const first = visiblePairsFor(data)[0];
      selected = first ? first.symbol : null;
    }
    renderSegments();
    renderRows();
    renderDetail();
  }
  renderStatus(err);
  if (manual) {
    if (err) toast("Refresh failed", err, { error: true });
    else if (source === "sample") toast("Still showing the snapshot", "The API didn’t answer.");
    else toast("Up to date", `Last cycle ${data.summary?.last_updated || "unknown"}`);
  }
}
function visiblePairsFor(d) { const keep = data; data = d; const v = visiblePairs(); data = keep; return v; }

$("refresh-btn").addEventListener("click", () => load({ manual: true }));
setInterval(() => { if (!document.hidden) load(); }, POLL_MS);

// ── Theme ────────────────────────────────────────────────────────────────────
const SUN = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const MOON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
function syncThemeBtn() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme-btn").innerHTML = dark ? SUN : MOON;
  $("theme-btn").setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
$("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.classList.add("no-transitions");
  root.dataset.theme = next;
  try { localStorage.setItem("ohm-sample-theme", next); } catch (e) {}
  syncThemeBtn();
  root.offsetWidth;
  requestAnimationFrame(() => root.classList.remove("no-transitions"));
});
syncThemeBtn();

// ── Clock + header edge ──────────────────────────────────────────────────────
function tick() {
  $("clock").textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Africa/Lagos", hour12: false }) + " WAT";
}
tick(); setInterval(tick, 1000);
addEventListener("scroll", () => $("header").classList.toggle("scrolled", scrollY > 0), { passive: true });

renderSegments();
load();
</script>
</body>
